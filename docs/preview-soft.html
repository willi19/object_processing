<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Library — Soft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --line: #ece7e0;
    --ink: #2b2722;
    --ink-soft: #8a8178;
    --accent: #e2603b;        /* warm coral */
    --accent-soft: #fdeee9;
  }

  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 18px; padding: 36px 0 26px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .count {
    font-size: 13px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); padding: 5px 12px; border-radius: 999px;
  }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .search-wrap { position: relative; }
  input[type="text"] {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 14px; padding: 11px 18px; width: 260px;
    border-radius: 999px; outline: none; transition: box-shadow .18s, border-color .18s;
    box-shadow: 0 1px 2px rgba(40,30,20,0.04);
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 2px 10px rgba(226,96,59,0.16); }
  input[type="text"]::placeholder { color: var(--ink-soft); }
  select {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 14px; padding: 11px 16px; border-radius: 999px;
    cursor: pointer; outline: none; box-shadow: 0 1px 2px rgba(40,30,20,0.04);
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 22px; padding: 8px 0 72px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 2px rgba(40,30,20,0.04);
    transition: transform .18s ease, box-shadow .22s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(40,30,20,0.10); }
  .card .frame {
    aspect-ratio: 1; background: var(--bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card .frame img { width: 84%; height: 84%; object-fit: contain; transition: transform .3s ease; }
  .card:hover .frame img { transform: scale(1.07); }
  .card .info { padding: 13px 16px 16px; }
  .card .label { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .card .id { font-size: 11px; color: var(--ink-soft); word-break: break-all; }
  .placeholder { font-size: 44px; color: var(--line); }
  mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 2px; }
  .empty { text-align: center; padding: 80px 0; color: var(--ink-soft); font-size: 15px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Object Library</h1>
        <span class="count" id="count"></span>
      </div>
      <div class="controls">
        <div class="search-wrap">
          <input type="text" id="search" placeholder="Search objects…" autocomplete="off">
        </div>
        <select id="sort">
          <option value="az">Name A → Z</option>
          <option value="za">Name Z → A</option>
        </select>
      </div>
    </header>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No objects found.</div>
  </div>
  <script src="preview-shared.js"></script>
  <script>initGallery({});</script>
</body>
</html>
