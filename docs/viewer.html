<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 14px;
    }

    header a:hover { text-decoration: underline; }

    header h2 {
      font-size: 18px;
      font-weight: 500;
    }

    .meta {
      font-size: 13px;
      color: #8b949e;
      margin-left: auto;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .meta .category {
      background: #21262d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }

    .meta a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 13px;
    }

    #viewer-container {
      flex: 1;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      --poster-color: #0d1117;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #8b949e;
    }

    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #f85149;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">&larr; Back</a>
    <h2 id="obj-label">Loading...</h2>
    <div class="meta">
      <span class="category" id="obj-category" style="display:none;"></span>
      <a id="download-link" href="#" style="display:none;">Download GLB</a>
    </div>
  </header>
  <div id="viewer-container">
    <model-viewer id="model" camera-controls auto-rotate touch-action="pan-y" style="display:none;"></model-viewer>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading 3D model...</div>
    </div>
    <div id="error">
      <div style="font-size:48px;margin-bottom:12px;">&#9888;</div>
      <div id="error-msg">Failed to load model.</div>
    </div>
  </div>

  <script type="module">
    const HF_BASE = 'https://huggingface.co/datasets/willi19/object_processing/resolve/main/';

    const params = new URLSearchParams(window.location.search);
    const objectId = params.get('id');

    if (!objectId) {
      showError('No object ID specified.');
    } else {
      init();
    }

    async function init() {
      let catalog;
      try {
        const res = await fetch('catalog.json');
        catalog = await res.json();
      } catch (e) {
        showError('Failed to load catalog.');
        return;
      }

      const obj = catalog.objects.find(o => o.id === objectId);
      if (!obj) {
        showError(`Object "${objectId}" not found in catalog.`);
        return;
      }

      document.getElementById('obj-label').textContent = obj.label;
      document.title = `${obj.label} - Object Viewer`;

      if (obj.category) {
        const catEl = document.getElementById('obj-category');
        catEl.textContent = obj.category;
        catEl.style.display = '';
      }

      const glbUrl = HF_BASE + obj.url;
      const dlLink = document.getElementById('download-link');
      dlLink.href = glbUrl;
      dlLink.style.display = '';

      const viewer = document.getElementById('model');
      viewer.src = glbUrl;
      viewer.style.display = 'block';

      viewer.addEventListener('load', () => {
        document.getElementById('loading').style.display = 'none';
      });

      viewer.addEventListener('error', (e) => {
        console.error('model-viewer error:', e);
        showError(`Failed to load 3D model.`);
      });
    }

    function showError(msg) {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
