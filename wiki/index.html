<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --chip: #21262d;
      --header-bg: rgba(22, 27, 34, 0.85);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --chip: #eaeef2;
        --header-bg: rgba(255, 255, 255, 0.85);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      color-scheme: light dark;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand { display: flex; align-items: baseline; gap: 12px; }

    header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }

    .count-badge {
      font-size: 13px;
      color: var(--muted);
      background: var(--chip);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .search-wrap { position: relative; }

    .search-wrap .kbd {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      pointer-events: none;
    }

    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 44px 8px 12px;
      font-size: 14px;
      width: 280px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      padding: 24px 32px 48px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card .thumb {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s ease;
    }
    .card:hover .thumb img { transform: scale(1.06); }
    .card .thumb .placeholder { font-size: 48px; color: var(--border); }

    .card .info { padding: 11px 12px; }
    .card .info .label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 3px;
      word-break: break-word;
    }
    .card .info .id {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
    }

    mark {
      background: rgba(88, 166, 255, 0.28);
      color: inherit;
      border-radius: 2px;
    }

    .empty {
      text-align: center;
      padding: 80px 32px;
      color: var(--muted);
      font-size: 16px;
    }
    .empty button {
      margin-top: 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .empty button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Object Library</h1>
      <span class="count-badge" id="count-badge"></span>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search objects..." autocomplete="off">
        <span class="kbd">/</span>
      </div>
      <select id="sort">
        <option value="az">Name A → Z</option>
        <option value="za">Name Z → A</option>
      </select>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <div id="empty-msg">No objects found.</div>
    <button id="clear-search" type="button">Clear search</button>
  </div>

  <script>
    let catalog = { objects: [] };

    const $search = document.getElementById('search');
    const $sort = document.getElementById('sort');
    const $grid = document.getElementById('grid');
    const $empty = document.getElementById('empty');
    const $emptyMsg = document.getElementById('empty-msg');
    const $badge = document.getElementById('count-badge');

    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json');
        catalog = await res.json();
      } catch (e) {
        console.error('Failed to load catalog.json:', e);
        $emptyMsg.textContent = 'Failed to load catalog.json.';
        $empty.style.display = 'block';
        return;
      }
      render();
    }

    function getFiltered() {
      const q = $search.value.toLowerCase().trim();
      let items = catalog.objects.filter(obj =>
        !q || obj.label.toLowerCase().includes(q) || obj.id.toLowerCase().includes(q)
      );
      const dir = $sort.value === 'za' ? -1 : 1;
      items.sort((a, b) => dir * a.label.localeCompare(b.label));
      return items;
    }

    // Highlight the matched substring in a piece of text.
    function highlight(text, q) {
      if (!q) return escapeHtml(text);
      const i = text.toLowerCase().indexOf(q);
      if (i < 0) return escapeHtml(text);
      return escapeHtml(text.slice(0, i)) +
        '<mark>' + escapeHtml(text.slice(i, i + q.length)) + '</mark>' +
        escapeHtml(text.slice(i + q.length));
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function render() {
      const q = $search.value.toLowerCase().trim();
      const filtered = getFiltered();

      $badge.textContent = q
        ? `${filtered.length} / ${catalog.objects.length}`
        : `${catalog.objects.length} objects`;

      $grid.innerHTML = '';

      if (filtered.length === 0) {
        $emptyMsg.textContent = q ? `No objects match “${q}”.` : 'No objects found.';
        $empty.style.display = 'block';
        return;
      }
      $empty.style.display = 'none';

      const frag = document.createDocumentFragment();
      filtered.forEach(obj => {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;
        const go = () => { window.location.href = `viewer.html?id=${encodeURIComponent(obj.id)}`; };
        card.onclick = go;
        card.onkeydown = (e) => { if (e.key === 'Enter') go(); };

        const thumbUrl = obj.thumb ? `objects/${obj.id}/thumb.png` : '';
        card.innerHTML = `
          <div class="thumb">
            ${thumbUrl
              ? `<img src="${thumbUrl}" alt="${escapeHtml(obj.label)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=placeholder>&#9645;</div>'">`
              : '<div class="placeholder">&#9645;</div>'}
          </div>
          <div class="info">
            <div class="label">${highlight(obj.label, q)}</div>
            <div class="id">${highlight(obj.id, q)}</div>
          </div>
        `;
        frag.appendChild(card);
      });
      $grid.appendChild(frag);
    }

    $search.addEventListener('input', render);
    $sort.addEventListener('change', render);
    document.getElementById('clear-search').addEventListener('click', () => {
      $search.value = '';
      $search.focus();
      render();
    });

    // Keyboard: "/" focuses search, Esc clears it.
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== $search) {
        e.preventDefault();
        $search.focus();
      } else if (e.key === 'Escape' && document.activeElement === $search) {
        $search.value = '';
        render();
        $search.blur();
      }
    });

    loadCatalog();
  </script>
</body>
</html>
